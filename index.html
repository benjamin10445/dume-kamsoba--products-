<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Dume Kamsoba African Supermarket</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    header {
      background: #4b210f;
      color: white;
      text-align: center;
      padding: 30px 15px;
    }

    header h1 {
      margin: 0;
      font-size: 28px;
    }

    header p {
      margin-top: 10px;
      font-size: 17px;
    }

    .products {
      max-width: 1100px;
      margin: auto;
      padding: 25px 15px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 18px;
    }

    .product {
      background: white;
      border-radius: 15px;
      overflow: hidden;
      box-shadow: 0 3px 12px rgba(0,0,0,0.15);
    }

    .product img {
      width: 100%;
      height: 230px;
      object-fit: cover;
      display: block;
    }

    .product h2 {
      text-align: center;
      font-size: 18px;
      margin: 14px 8px;
    }

    footer {
      background: black;
      color: white;
      text-align: center;
      padding: 25px 10px;
      line-height: 1.7;
      font-weight: bold;
    }

    @media (max-width: 500px) {
      header h1 {
        font-size: 22px;
      }

      .products {
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
      }

      .product img {
        height: 190px;
      }

      .product h2 {
        font-size: 15px;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>DUME KAMUSOBA AFRICAN SUPERMARKET</h1>
    <p>Our Products</p>
  </header>

  <main class="products">

    <div class="product">
      <img src="images/aromat.png" alt="Aromat">
      <h2>AROMAT</h2>
    </div>

    <div class="product">
      <img src="images/tea-masala.png" alt="Tea Masala">
      <h2>TEA MASALA</h2>
    </div>

    <div class="product">
      <img src="images/cassava-flour.png" alt="Cassava Flour">
      <h2>CASSAVA FLOUR</h2>
    </div>

    <div class="product">
      <img src="images/rice.png" alt="Rice">
      <h2>RICE</h2>
    </div>

    <div class="product">
      <img src="images/curry-powder.png" alt="Simba Mbili Curry Powder">
      <h2>SIMBA MBILI CURRY POWDER</h2>
    </div>

    <div class="product">
      <img src="images/african-spices.png" alt="African Spices">
      <h2>AFRICAN SPICES</h2>
    </div>

    <div class="product">
      <img src="images/maize-flour.png" alt="Maize Flour">
      <h2>MAIZE FLOUR</h2>
    </div>

  </main>

  <footer>
    EXCLUSIVELY IMPORTED BY<br>
    DUME KAMUSOBA AFRICAN SUPERMARKET<br>
    TEL: 0482047902<br>
    26 HAMBLYNN ROAD ELIZABETH DOWNS 5113<br>
    SHOP NO.2
  </footer>

</body>
</html>
